name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1, leave empty to auto-generate)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and push tag
        id: resolve_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$TAG_INPUT"
            if [ -z "$TAG" ]; then
              LATEST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")
              if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
                TAG="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${RUN_NUMBER}"
              else
                TAG="v1.0.${RUN_NUMBER}"
              fi
              while git rev-parse "$TAG" >/dev/null 2>&1; do
                TAG="${TAG}-$(date +%s)"
              done
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          else
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish win-x64
        run: dotnet publish src/EhViewer.Desktop/EhViewer.Desktop.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -o publish/win-x64

      - name: Publish win-arm64
        run: dotnet publish src/EhViewer.Desktop/EhViewer.Desktop.csproj -c Release -r win-arm64 -p:Platform=ARM64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -o publish/win-arm64

      - name: Package artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          Compress-Archive -Path publish/win-x64/* -DestinationPath "EhViewer-Desktop-$($env:RELEASE_TAG)-win-x64.zip" -Force
          Compress-Archive -Path publish/win-arm64/* -DestinationPath "EhViewer-Desktop-$($env:RELEASE_TAG)-win-arm64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            EhViewer-Desktop-${{ needs.prepare.outputs.tag }}-win-x64.zip
            EhViewer-Desktop-${{ needs.prepare.outputs.tag }}-win-arm64.zip
