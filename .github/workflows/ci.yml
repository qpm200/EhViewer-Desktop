name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EhViewer.Desktop.slnx -p:Platform=x64

      - name: Build
        run: dotnet build EhViewer.Desktop.slnx -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test EhViewer.Desktop.slnx -c Release -p:Platform=x64 --no-build --verbosity normal
        
